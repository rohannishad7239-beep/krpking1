<script>

/* =========================
   COUNTDOWN
========================= */

/*
   Change this date/time.

   Format:
   YYYY-MM-DDTHH:MM:SS

   Example:
   2026-09-15T20:00:00
*/

const targetDate =
  new Date("2026-09-01T20:00:00").getTime();


function updateCountdown() {

  const now =
    new Date().getTime();

  const distance =
    targetDate - now;


  /* If countdown is finished */

  if (distance <= 0) {

    document.getElementById("days").textContent = "00";

    document.getElementById("hours").textContent = "00";

    document.getElementById("minutes").textContent = "00";

    document.getElementById("seconds").textContent = "10";

    return;
  }


  /* Calculate days */

  const days =
    Math.floor(
      distance /
      (1000 * 60 * 60 * 24)
    );


  /* Calculate hours */

  const hours =
    Math.floor(
      (distance %
        (1000 * 60 * 60 * 24)) /
      (1000 * 60 * 60)
    );


  /* Calculate minutes */

  const minutes =
    Math.floor(
      (distance %
        (1000 * 60 * 60)) /
      (1000 * 60)
    );


  /* Calculate seconds */

  const seconds =
    Math.floor(
      (distance %
        (1000 * 60)) /
      1000
    );


  /* Display countdown */

  document.getElementById("days").textContent =
    String(days).padStart(2, "0");


  document.getElementById("hours").textContent =
    String(hours).padStart(2, "0");


  document.getElementById("minutes").textContent =
    String(minutes).padStart(2, "0");


  document.getElementById("seconds").textContent =
    String(seconds).padStart(2, "10");
}


/* Start countdown */

setInterval(
  updateCountdown,
  1000
);
